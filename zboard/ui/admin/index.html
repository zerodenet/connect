<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connect 客户端通信</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main>
    <header class="page-heading compact">
      <div>
        <h1>客户端通信</h1>
        <p>配置设备授权、订阅投影和消息同步使用的公开来源地址。</p>
      </div>
      <span id="status" class="status-pill">未配置</span>
    </header>

    <section id="notice" class="notice" role="status" hidden>
      <div class="notice-mark" aria-hidden="true">i</div>
      <div><strong id="notice-title"></strong><p id="notice-detail"></p></div>
    </section>

    <form id="settings" class="panel form-panel">
      <header><h2>连接设置</h2><p>配置由 ZBoard 加密保存；身份密钥和设备会话由插件私有存储管理。</p></header>
      <div class="form-body">
        <label class="switch-row">
          <span><strong>启用 Connect</strong><small>开放签名能力发现与加密交换入口。</small></span>
          <input id="enabled" type="checkbox">
        </label>
        <label class="field">
          <span>服务来源</span>
          <input id="provider-id" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://panel.example.com" required>
          <small>首次配置会自动使用当前 ZBoard 页面的 HTTPS 来源；也可以改为实际对外地址。不能包含路径、查询参数或结尾斜杠。</small>
        </label>
        <label class="field">
          <span>来源名称</span>
          <input id="display-name" type="text" maxlength="80" autocomplete="off" placeholder="我的 ZBoard">
          <small>客户端订阅设置中会用它区分不同来源。</small>
        </label>
      </div>
      <footer class="form-actions">
        <button id="save" class="primary" type="submit">保存设置</button>
        <button id="test" type="button" disabled>验证已保存配置</button>
        <span id="progress" aria-live="polite"></span>
      </footer>
    </form>

    <section class="panel">
      <header><h2>客户端入口</h2><p>客户端只需要填写来源地址；具体路径由协议固定。</p></header>
      <dl class="status-list">
        <div><dt>能力发现</dt><dd id="capabilities-url">保存来源后显示</dd></div>
        <div><dt>加密交换</dt><dd id="exchange-url">保存来源后显示</dd></div>
        <div><dt>服务能力</dt><dd>设备授权 · ZNet Sink 订阅 · 公告消息</dd></div>
        <div><dt>下一步</dt><dd id="next-step">先保存并启用 Connect</dd></div>
      </dl>
    </section>

    <p class="footnote">插件只通过受治理的宿主能力验证账号并投影当前账号可见数据，不会获得密码哈希、管理员令牌、数据库连接或核心表访问权。</p>
  </main>
  <script>
    (() => {
      const token = new URLSearchParams(location.hash.slice(1)).get('bridge_token');
      let next = 1;
      let revision = 0;
      let configured = false;
      let busy = false;
      let dirty = false;
      const pending = new Map();
      const $ = id => document.getElementById(id);

      addEventListener('message', event => {
        const value = event.data;
        if (event.source !== parent || !value || value.source !== 'zboard-plugin-host' || value.bridge_token !== token) return;
        const item = pending.get(value.request_id);
        if (!item) return;
        pending.delete(value.request_id);
        value.ok ? item.resolve(value.result) : item.reject(new Error(value.error || '宿主拒绝请求'));
      });

      function call(type, payload = {}) {
        return new Promise((resolve, reject) => {
          const request_id = `connect-${next++}`;
          pending.set(request_id, {resolve, reject});
          parent.postMessage({source:'zboard-plugin-ui', bridge_token:token, request_id, type, ...payload}, '*');
        });
      }

      function setBusy(nextBusy, text = '') {
        updateActions(nextBusy);
        window.requestAnimationFrame(resize);
        $('progress').textContent = text;
      }

      function updateActions(nextBusy = busy) {
        busy = nextBusy;
        $('save').disabled = busy;
        $('test').disabled = busy || !configured || dirty;
      }

      function showNotice(title, detail, error = false) {
        $('notice').hidden = false;
        $('notice').classList.toggle('error', error);
        $('notice-title').textContent = title;
        $('notice-detail').textContent = detail;
        resize();
      }

      function renderEndpoint() {
        const origin = $('provider-id').value.trim().replace(/\/$/, '');
        $('capabilities-url').textContent = origin ? `${origin}/.well-known/zerodenet-connect/v1/capabilities` : '保存来源后显示';
        $('exchange-url').textContent = origin ? `${origin}/.well-known/zerodenet-connect/v1/exchange` : '保存来源后显示';
      }

      function normalizedOrigin(value) {
        let url;
        try {
          url = new URL(value);
        } catch {
          throw new Error('服务来源必须是完整的 HTTPS 地址。');
        }
        if (url.protocol !== 'https:') throw new Error('服务来源必须使用 HTTPS。');
        if (url.username || url.password || (url.pathname && url.pathname !== '/') || url.search || url.hash) {
          throw new Error('服务来源只能填写站点来源，不能包含账号、路径、查询参数或锚点。');
        }
        return url.origin;
      }

      function currentSiteOrigin(context) {
        const candidates = [context && context.site_url, location.href];
        for (const candidate of candidates) {
          if (typeof candidate !== 'string' || !candidate) continue;
          try {
            const origin = new URL(candidate).origin;
            if (origin.startsWith('https://')) return origin;
          } catch {}
        }
        return '';
      }

      function configFromForm() {
        return {
          enabled: $('enabled').checked,
          provider_id: normalizedOrigin($('provider-id').value.trim()),
          display_name: $('display-name').value.trim() || 'ZBoard'
        };
      }

      function sameConfig(left, right) {
        return left.enabled === right.enabled &&
          left.provider_id === right.provider_id &&
          left.display_name === right.display_name;
      }

      function applyView(view, context = {}) {
        revision = view.revision || 0;
        configured = view.configured === true;
        const config = view.config || {};
        $('enabled').checked = configured && config.enabled === true;
        $('provider-id').value = configured && typeof config.provider_id === 'string'
          ? config.provider_id
          : currentSiteOrigin(context);
        $('display-name').value = configured && typeof config.display_name === 'string'
          ? config.display_name
          : 'ZBoard';
        dirty = false;
        $('status').textContent = !configured ? '未配置' : config.enabled ? '已启用' : '已停用';
        $('status').className = `status-pill ${configured && config.enabled ? 'success' : ''}`;
        $('next-step').textContent = configured && config.enabled
          ? `在 ZNet Sink 的 Connect 管理页添加来源：${config.provider_id}`
          : configured
            ? '当前配置已保存；启用 Connect 后客户端才可连接'
            : '确认来源地址，启用 Connect 并保存';
        renderEndpoint();
        updateActions(false);
      }

      function markDirty() {
        if (busy) return;
        dirty = true;
        $('status').textContent = '有未保存更改';
        $('status').className = 'status-pill warning';
        $('next-step').textContent = '保存当前更改后再到客户端添加来源';
        updateActions(false);
      }

      function resize() {
        parent.postMessage({source:'zboard-plugin-ui', bridge_token:token, type:'ui.resize', height:document.documentElement.scrollHeight}, '*');
      }

      $('provider-id').addEventListener('input', () => { renderEndpoint(); markDirty(); });
      $('display-name').addEventListener('input', markDirty);
      $('enabled').addEventListener('change', markDirty);
      $('settings').addEventListener('submit', async event => {
        event.preventDefault();
        setBusy(true, '正在保存…');
        try {
          const config = configFromForm();
          const saved = await call('config.save', {revision, config});
          const view = await call('config.load');
          const persisted = view.config || {};
          if (!view.configured || view.revision !== saved.revision || !sameConfig(config, persisted)) {
            throw new Error('宿主没有返回刚刚保存的配置；为避免显示错误状态，本页未将操作标记为成功。');
          }
          applyView(view);
          showNotice(
            config.enabled ? '设置已保存并启用' : '设置已保存但仍停用',
            config.enabled
              ? `下一步：在 ZNet Sink 的 Connect 管理页添加来源 ${config.provider_id}，然后授权设备。`
              : '如需客户端连接，请勾选“启用 Connect”后再次保存。'
          );
        } catch (error) {
          showNotice('保存失败', error instanceof Error ? error.message : '宿主未能保存设置，请重新加载后再试。', true);
        } finally {
          updateActions(false);
          $('progress').textContent = '';
        }
      });

      $('test').addEventListener('click', async () => {
        setBusy(true, '正在验证…');
        try {
          const view = await call('config.load');
          if (!view.configured) throw new Error('尚未保存配置。');
          if (view.config?.enabled !== true) throw new Error('配置已经保存，但 Connect 仍处于停用状态。');
          await call('config.test');
          applyView(view);
          showNotice('已保存的配置有效', `下一步：在 ZNet Sink 的 Connect 管理页添加来源 ${view.config.provider_id}，然后授权设备。`);
        } catch (error) {
          showNotice('验证失败', error instanceof Error ? error.message : '请检查 HTTPS 来源地址并先保存设置。', true);
        } finally {
          updateActions(false);
          $('progress').textContent = '';
        }
      });

      Promise.all([call('context.load'), call('config.load')]).then(([context, view]) => {
        applyView(view, context);
        parent.postMessage({source:'zboard-plugin-ui', bridge_token:token, request_id:`ready-${next++}`, type:'plugin.ready'}, '*');
        resize();
      }).catch(error => showNotice('无法读取配置', error instanceof Error ? error.message : '扩展会话可能已经失效，请重新加载页面。', true));
    })();
  </script>
</body>
</html>
